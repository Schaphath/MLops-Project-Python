# Les dashboards JSON de /var/lib/grafana/dashboards sont importés au démarrage
# (dossier « OncoScan » dans Grafana). Modifs faites dans l'UI : exporter le JSON ici.
apiVersion: 1

providers:
  - name: oncoscan
    folder: OncoScan
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
