# Configuration Prometheus - OncoScan IA
# Prometheus vient lire (« scrape ») les métriques de chaque cible à intervalle régulier.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Santé technique de l'API : requêtes, latence, erreurs + métriques métier oncoscan_*
  - job_name: oncoscan-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Santé du modèle : drift et performance calculés par le job Evidently
  - job_name: oncoscan-evidently
    metrics_path: /metrics
    scrape_interval: 60s
    static_configs:
      - targets: ["evidently:8085"]

  # Prometheus se surveille lui-même
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
