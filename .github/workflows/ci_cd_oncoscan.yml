# Pipeline CI/CD OncoScan : qualité -> build + scan + smoke test -> publication Docker Hub
name: OncoScan CI/CD

# Quand le workflow se déclenche
on:
  push:
    branches: [main]          # à chaque push sur main
    tags: ['v*.*.*']          # à chaque tag de version (ex. v2.0.0)
  pull_request:
    branches: [main]          # à chaque PR vers main (build + tests, SANS publication)
  workflow_dispatch:          # lancement manuel possible

# Droits minimum du token GitHub : lecture du code uniquement
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # On annule un ancien run seulement pour les PR.
  # Sur main/tags, on ne coupe JAMAIS une publication en cours
  # (sinon une image pourrait être publiée et pas l'autre).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'

jobs:
  # -----------------------------------------------------------------
  # 1) Contrôles qualité : tests + validation de la configuration
  # -----------------------------------------------------------------
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15   # évite qu'un job bloqué tourne pendant 6 heures
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            Api/requirements_api.txt
            requirements_dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Api/requirements_api.txt -r requirements_dev.txt

      # Erreurs, imports, failles de sécurité courantes (règles dans pyproject.toml)
      - name: Lint (ruff)
        run: ruff check .

      # Tests du modèle (performances, cohérence de l'artefact) et de l'API (auth, validation, métriques)
      - name: Run tests
        run: |
          mkdir -p Tests_results
          pytest -v --json-report --json-report-file=Tests_results/results.json

      # Conserve le rapport de tests (même si les tests échouent)
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: Tests_results/
          if-no-files-found: ignore
          retention-days: 14

      # Vérifie qu'il n'y a pas d'erreur de syntaxe Python
      - name: Compile Python sources
        run: python -m compileall -q Api Interface Model Monitoring

      # Vérifie les fichiers compose avec des valeurs factices (toutes les variables obligatoires)
      - name: Validate Docker Compose configuration
        env:
          DOCKERHUB_USER: ci
          DB_NAME: ci_db
          DB_USER: ci_user
          DB_PASSWORD: ci_password
          API_KEY: ci_api_key
          VERSION: ci
          GRAFANA_ADMIN_PASSWORD: ci_grafana
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config --quiet
          docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml config --quiet

  # -----------------------------------------------------------------
  # 2) Construction, scan de sécurité et test de démarrage des images
  #    (aucune publication ici)
  # -----------------------------------------------------------------
  build-scan:
    name: Build & scan ${{ matrix.name }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_REF: ${{ matrix.image }}:ci-${{ github.sha }}
    strategy:
      fail-fast: false   # si une image échoue, les autres sont quand même testées
      matrix:
        include:
          - name: api
            image: oncoscan-api
            dockerfile: Api/Dockerfile
            context: .
          - name: interface
            image: oncoscan-app
            dockerfile: Interface/Dockerfile
            context: .
          - name: evidently
            image: oncoscan-evidently
            dockerfile: Monitoring/evidently/Dockerfile
            context: Monitoring/evidently
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Connexion à Docker Hub pour éviter les limites de téléchargement de l'image
      # de base Python (impossible pour les PR venant de forks : pas de secrets)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construit l'image en local (non publiée) pour la tester.
      # Le modèle est copié dans l'image : il doit être présent dans le dépôt, sinon le build échoue.
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            VERSION=ci-${{ github.sha }}
          load: true
          push: false
          pull: true   # récupère la dernière version de l'image de base (correctifs de sécurité)
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Scan des vulnérabilités en deux temps :
      # 1) rapport complet CRITICAL + HIGH, affiché mais NON bloquant
      #    (les nouvelles failles HIGH sont corrigées via les PR Dependabot)
      # 2) blocage uniquement sur CRITICAL qui ont un correctif
      # Exceptions justifiées : fichier .trivyignore à la racine (une CVE par ligne + commentaire).
      # Action épinglée sur un commit précis (v0.36.0) : ses tags ont été piratés en
      # mars 2026 (avis GHSA-69fq-xp46-6x23), un commit ne peut pas être modifié.
      - name: Scan image with Trivy (report CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan image with Trivy (block on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'   # base déjà téléchargée par l'étape précédente
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
          trivyignores: .trivyignore

      # Vérifie que le conteneur démarre vraiment et devient "healthy",
      # avec les mêmes restrictions que dans docker-compose (sans privilèges).
      # On teste l'image telle qu'elle sera publiée, modèle inclus.
      - name: Smoke test (container starts and is healthy)
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail

          case "$NAME" in
            api)
              ARGS=(-e API_KEY=ci-test-key)
              ;;
            interface)
              ARGS=(-e API_KEY=ci-test-key -e DB_PASSWORD=ci-test-password)
              ;;
            evidently)
              # Pas de base en CI : le job échoue à se connecter, mais le serveur /metrics
              # doit rester debout (c'est ce que vérifie le healthcheck)
              ARGS=(-e DB_NAME=ci -e DB_USER=ci -e DB_PASSWORD=ci -e DB_HOST=127.0.0.1)
              ;;
            *)
              echo "Service inconnu : $NAME"
              exit 1
              ;;
          esac

          docker run -d --name smoke \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --health-interval 5s \
            "${ARGS[@]}" "$IMAGE_REF"

          # Attend jusqu'à ~2 minutes que le healthcheck du Dockerfile passe au vert
          for attempt in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            echo "Tentative ${attempt}/40 : ${status}"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            [ "$(docker inspect --format '{{.State.Running}}' smoke)" = "true" ] || break
            sleep 3
          done

          echo "::error::Le conteneur ${NAME} n'est pas devenu healthy"
          docker logs smoke
          exit 1

  # -----------------------------------------------------------------
  # 3) Publication sur Docker Hub
  #    Seulement si TOUTES les images ont passé le scan et le smoke test,
  #    et uniquement sur push vers main ou sur un tag de version
  # -----------------------------------------------------------------
  publish:
    name: Publish ${{ matrix.name }}
    needs: build-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45   # le build ARM (émulé) est plus long
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: oncoscan-api
            dockerfile: Api/Dockerfile
            context: .
          - name: interface
            image: oncoscan-app
            dockerfile: Interface/Dockerfile
            context: .
          - name: evidently
            image: oncoscan-evidently
            dockerfile: Monitoring/evidently/Dockerfile
            context: Monitoring/evidently
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Émulation ARM pour publier aussi une image compatible Mac M1/M2 et serveurs ARM
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tags publiés : sha-xxxxxxx, latest (sur main) et X.Y.Z (sur un tag vX.Y.Z)
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Reconstruit avec le cache du job précédent et publie.
      # VERSION est inscrit dans l'image (et donc dans MODEL_VERSION côté API).
      - name: Push image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}