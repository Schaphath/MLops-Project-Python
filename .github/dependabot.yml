# Dependabot ouvre une PR dès qu'une version plus récente existe.
# Chaque PR passe par la CI (lint, tests, scan Trivy, smoke test) avant d'être fusionnée.
version: 2
updates:
  # Actions GitHub utilisées dans les workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:            # une seule PR pour toutes les actions
        patterns: ["*"]

  # Dépendances Python : c'est là que se trouvent la plupart des failles de sécurité
  - package-ecosystem: pip
    directories:
      - /
      - /Api
      - /Interface
      - /Model
      - /Monitoring/evidently
    schedule:
      interval: weekly
    groups:
      python-mineures:    # correctifs regroupés pour éviter 15 PR par semaine
        update-types: [minor, patch]
    ignore:
      # Le modèle est sauvegardé avec scikit-learn 1.8 : changer de version mineure
      # oblige à le réentraîner. Ça se fait à la main, pas via Dependabot.
      - dependency-name: scikit-learn
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Evidently 0.7 ne fonctionne pas avec pandas 3
      - dependency-name: pandas
        update-types: ["version-update:semver-major"]

  # Images de base des Dockerfile.
  # Ne marche que si le FROM contient la version en clair (pas ${PYTHON_VERSION}).
  - package-ecosystem: docker
    directories:
      - /Api
      - /Interface
      - /Monitoring/evidently
    schedule:
      interval: weekly
    ignore:
      # Correctifs de 3.12 seulement : passer à 3.13 se décide et se teste à la main
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Images des fichiers docker-compose (postgres, prometheus, grafana)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 16 -> 17 demande une migration des données : jamais automatiquement
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
