# Compose de développement : construit les images depuis le code.
# Publier :  docker compose build && docker compose push
# (pour ARM + x86, voir la commande buildx dans le README)

# Limite la taille des logs
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Aucun privilège Linux pour l'API et l'interface
x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data # Données conservées même si le conteneur est supprimé
      # Exécuté uniquement à la première création du volume.
      # Base existante -> lancer migration_v2_1.sql à la main.
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - db-net

  api:
    <<: [*logging, *hardening]
    build:
      context: .
      dockerfile: ./Api/Dockerfile
      args:
        VERSION: ${VERSION:-2.0.0}
    # Format Docker Hub : pseudo/nom:tag
    image: ${DOCKERHUB_USER:?DOCKERHUB_USER must be set}/oncoscan-api:${VERSION:-2.0.0}
    container_name: oncoscan-api
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?API_KEY must be set}
      LOG_LEVEL: INFO
      # MODEL_PATH et MODEL_VERSION sont fixés dans l'image (modèle inclus)
    # Healthcheck défini dans Api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000" # Accès local uniquement (debug, /docs)
    networks:
      - internal-net # L'API n'a pas besoin de la base de données

  interface:
    <<: [*logging, *hardening]
    build:
      context: .
      dockerfile: ./Interface/Dockerfile
      args:
        VERSION: ${VERSION:-2.0.0}
    image: ${DOCKERHUB_USER:?DOCKERHUB_USER must be set}/oncoscan-app:${VERSION:-2.0.0}
    container_name: oncoscan-app
    restart: unless-stopped
    environment:
      API_URL: http://api:8000/predict
      API_KEY: ${API_KEY:?API_KEY must be set}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME must be set}
      DB_USER: ${DB_USER:?DB_USER must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false} # Fermé par défaut
    # Healthcheck défini dans Interface/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      # Seul point d'entrée public. En HTTP, les mots de passe passent en clair :
      # en prod, reverse proxy HTTPS devant et "127.0.0.1:8501:8501".
      - "8501:8501"
    networks:
      - internal-net
      - db-net

volumes:
  pgdata:

networks:
  internal-net:
    driver: bridge # Réseau entre l'interface et l'API
  db-net:
    driver: bridge # Réseau BD
    internal: true # Aucun accès public